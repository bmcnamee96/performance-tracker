name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore performance-tracker.sln

      - name: Format check
        run: dotnet format performance-tracker.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build performance-tracker.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test performance-tracker.sln --configuration Release --no-build --verbosity normal
